# Configuration du blog Reindaxia (GitHub Pages / Jekyll)
# Les pages .html existantes sans en-tête "---" sont publiées telles quelles.
title: "Reindaxia Engineering & Advising"
description: "Articles de Reindaxia : qualité des projets, inspection et FAT, mechanical completion, HSE et PGES de chantier, ATEX, systèmes de management ISO 9001, 14001 et 45001, audits, management de projet, marchés publics et contrats FIDIC, en Tunisie, en Afrique du Nord et en Afrique."
url: "https://www.reindaxia.tn"
baseurl: ""
lang: fr
timezone: Africa/Tunis
permalink: /blog/:title.html
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
feed:
  path: blog/feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      author: "Reindaxia Engineering & Advising"
exclude:
  - README.md
  - LISEZMOI.txt
  - GUIDE-BLOG.md
