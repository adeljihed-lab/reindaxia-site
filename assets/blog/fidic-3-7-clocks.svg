<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Agreement or determination: the clocks</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Day 0 = commencement date (for a claim: receipt of the fully detailed claim)</text><text x="60" y="166.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Day 0</text><text x="60" y="238.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">commencement</text><text x="330" y="166.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 42 days</text><text x="330" y="223.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">consultation →</text><text x="330" y="238.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Notice of the Parties'</text><text x="330" y="253.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Agreement</text><text x="600" y="166.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 42 days more</text><text x="600" y="223.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Notice of the</text><text x="600" y="238.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Engineer's</text><text x="600" y="253.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Determination</text><text x="760" y="166.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+14 / +7</text><text x="760" y="230.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">clerical errors</text><text x="760" y="245.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">reported / fixed</text><text x="900" y="166.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+28 days</text><text x="900" y="230.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">NOD, or final</text><text x="900" y="245.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">&amp; binding</text><text x="185.0" y="358.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">No agreement in time?</text><text x="185.0" y="375.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">→ Engineer gives notice</text><text x="185.0" y="391.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">and determines</text><text x="500.0" y="358.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">No determination in time?</text><text x="500.0" y="375.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">claim → deemed rejected</text><text x="500.0" y="391.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">other matter → Dispute</text><text x="815.0" y="358.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">NOD given?</text><text x="815.0" y="375.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">→ refer to DAAB</text><text x="815.0" y="391.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">within 42 days</text><text x="40" y="460.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Binding in the meantime: money agreed or determined goes into the next statement and payment certificate.</text></g>
