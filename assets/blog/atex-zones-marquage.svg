<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="80" y="170" width="360" height="330" rx="30" fill="#fde7bd" stroke="#1d2b44" stroke-width="2" stroke-dasharray="8 6"/><circle cx="260" cy="230" r="60" fill="#f9c97a" stroke="#1d2b44" stroke-width="2"/><rect x="170" y="290" width="180" height="190" rx="4" fill="#f6d5cf" stroke="#1d2b44" stroke-width="2"/><rect x="250" y="230" width="20" height="60" rx="2" fill="#c4cad3" stroke="#1d2b44" stroke-width="2"/><line x1="60" y1="480" x2="460" y2="480" stroke="#1d2b44" stroke-width="3"/><rect x="520" y="190" width="70" height="40" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="520" y="248" width="70" height="40" rx="8" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><rect x="520" y="306" width="70" height="40" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="520" y="364" width="70" height="40" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="520" y="422" width="70" height="40" rx="8" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Zones autour d'un bac et lecture d'un marquage</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Exemple schématique : l'étendue réelle se calcule selon IEC 60079-10-1</text><text x="110" y="190.0" font-size="14" text-anchor="start" font-weight="700" fill="#a86b00" dominant-baseline="middle">Zone 2</text><text x="260" y="200.0" font-size="13" text-anchor="middle" font-weight="700" fill="#7a4a00" dominant-baseline="middle">Zone 1</text><text x="260" y="373.8" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">Zone 0</text><text x="260" y="390.0" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">(espace vapeur</text><text x="260" y="406.2" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">intérieur)</text><text x="300" y="255.0" font-size="12" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">évent</text><text x="60" y="525.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Zone 0 : présence permanente</text><text x="60" y="540.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Zone 1 : occasionnelle en fonctionnement normal</text><text x="60" y="555.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Zone 2 : accidentelle ou de courte durée</text><text x="520" y="150.0" font-size="30" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Ex db IIB T4 Gb</text><text x="555.0" y="210.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Ex</text><text x="605" y="210.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">matériel pour atmosphère explosive</text><text x="555.0" y="268.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">db</text><text x="605" y="268.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">mode de protection : enveloppe antidéflagrante</text><text x="555.0" y="326.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">IIB</text><text x="605" y="326.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">groupe de gaz (éthylène…) ; convient aussi à IIA</text><text x="555.0" y="384.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">T4</text><text x="605" y="384.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">température de surface ≤ 135 °C</text><text x="555.0" y="442.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Gb</text><text x="605" y="442.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">niveau de protection : compatible zone 1 (et 2)</text><text x="520" y="537.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Le marquage ne suffit pas : presse-étoupes, entrées</text><text x="520" y="552.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">non utilisées et liaisons font partie du mode de protection.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="606" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="628" x2="986" y2="628" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="606" x2="756" y2="652" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="621" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="644" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="621" font-size="11" fill="#0b1f3a">Croquis · 06/2024</text><text x="766" y="644" font-size="11" fill="#0b1f3a">Zones ATEX et marquage</text></g>
</svg>