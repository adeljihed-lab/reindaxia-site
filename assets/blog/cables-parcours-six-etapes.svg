00" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><circle cx="576" cy="200" r="52" fill="#fff" stroke="#1d2b44" stroke-width="2"/><circle cx="576" cy="200" r="18" fill="#c4cad3" stroke="#1d2b44" stroke-width="2"/><path d="M 536 170 A 44 44 0 0 1 616 170" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 542 178 A 36 36 0 0 1 610 178" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 548 186 A 28 28 0 0 1 604 186" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="468" y1="200" x2="520" y2="200" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><circle cx="738" cy="200" r="52" fill="#fff" stroke="#1d2b44" stroke-width="2"/><circle cx="738" cy="200" r="18" fill="#c4cad3" stroke="#1d2b44" stroke-width="2"/><path d="M 698 170 A 44 44 0 0 1 778 170" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 704 178 A 36 36 0 0 1 772 178" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 710 186 A 28 28 0 0 1 766 186" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="630" y1="200" x2="682" y2="200" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><circle cx="900" cy="200" r="52" fill="#fff" stroke="#1d2b44" stroke-width="2"/><circle cx="900" cy="200" r="18" fill="#c4cad3" stroke="#1d2b44" stroke-width="2"/><path d="M 860 170 A 44 44 0 0 1 940 170" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 866 178 A 36 36 0 0 1 934 178" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 872 186 A 28 28 0 0 1 928 186" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="