<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">De l'extrudeuse au poteau : six étapes, six risques</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Chaque passage de main doit laisser une trace : rapport, photo datée, réserve écrite</text><text x="90" y="276.6" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Fabrication</text><text x="90" y="293.4" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">et essais</text><text x="90" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">essais individuels</text><text x="90" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">à 100 %</text><text x="252" y="276.6" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Condition-</text><text x="252" y="293.4" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">nement</text><text x="252" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">fût ≥ rayon de</text><text x="252" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">courbure, capuchons</text><text x="414" y="276.6" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Chargement</text><text x="414" y="293.4" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">transport</text><text x="414" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">tourets debout,</text><text x="414" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">calés, photos</text><text x="576" y="285.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Réception</text><text x="576" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">inspection</text><text x="576" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">contradictoire</text><text x="738" y="285.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Stockage</text><text x="738" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">debout, sol stable,</text><text x="738" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">sens de rotation</text><text x="900" y="276.6" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Pose et</text><text x="900" y="293.4" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">mise en service</text><text x="900" y="327.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">isolement avant</text><text x="900" y="342.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">et après pose</text><text x="500" y="425.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1d2b44" font-style="italic" dominant-baseline="middle">Deux défauts vus sur le terrain : un clou de l'habillage traversant la gaine · un câble poussé au-delà de sa capacité en service</text></g>
