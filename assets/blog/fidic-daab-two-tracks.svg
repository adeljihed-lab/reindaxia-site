<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-label="DAAB: avoidance and adjudication">
<defs>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e9e2d2" stroke-width="1"/></pattern>
<filter id="r" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="21"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2b44"/></marker>
</defs>
<rect width="1000" height="624" fill="#fbf8f1"/><rect width="1000" height="624" fill="url(#g)"/>
<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="40" y="140" width="210" height="66" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><rect x="275" y="140" width="210" height="66" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><line x1="250" y1="173" x2="273" y2="173" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="510" y="140" width="210" height="66" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><line x1="485" y1="173" x2="508" y2="173" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="745" y="140" width="210" height="66" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><line x1="720" y1="173" x2="743" y2="173" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="320" width="170" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="228" y="320" width="170" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="210" y1="353" x2="226" y2="353" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="416" y="320" width="170" height="66" rx="8" fill="#f6d5cf" stroke="#1d2b44" stroke-width="2"/><line x1="398" y1="353" x2="414" y2="353" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="604" y="320" width="170" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="586" y1="353" x2="602" y2="353" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="792" y="320" width="170" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="774" y1="353" x2="790" y2="353" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><path d="M 820 206 C 900 240, 900 280, 870 318" stroke="#1d2b44" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Two tracks for one standing board</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Most value lies in the upper track, used early</text><text x="40" y="120.0" font-size="15" text-anchor="start" font-weight="800" fill="#2f6b4f" dominant-baseline="middle">AVOIDANCE</text><text x="145.0" y="164.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Appointment</text><text x="145.0" y="181.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 28 d after LoA</text><text x="380.0" y="164.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Site visits</text><text x="380.0" y="181.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">every 70–140 d</text><text x="615.0" y="164.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Reports, programme,</text><text x="615.0" y="181.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">registers shared</text><text x="850.0" y="164.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Informal assistance</text><text x="850.0" y="181.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">(joint request, 21.3)</text><text x="40" y="235.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">not binding on parties · board not bound later · both parties present</text><text x="40" y="300.0" font-size="15" text-anchor="start" font-weight="800" fill="#b23a2e" dominant-baseline="middle">ADJUDICATION</text><text x="125.0" y="345.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">NOD on Engineer's</text><text x="125.0" y="360.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">determination</text><text x="313.0" y="345.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Referral</text><text x="313.0" y="360.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 42 d</text><text x="501.0" y="345.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Decision</text><text x="501.0" y="360.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 84 d (binding)</text><text x="689.0" y="345.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">NOD ≤ 28 d</text><text x="689.0" y="360.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">else final</text><text x="877.0" y="345.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Amicable 28 d</text><text x="877.0" y="360.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">→ arbitration</text><text x="40" y="440.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Comply promptly even when challenging: amounts awarded are immediately due; security may be ordered.</text><text x="40" y="470.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Fees shared 50/50 — compare with the cost of one contested claim carried to the end of the contract.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="566" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="588" x2="986" y2="588" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="566" x2="756" y2="612" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="581" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="604" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="581" font-size="11" fill="#0b1f3a">Sketch · 07/2026</text><text x="766" y="604" font-size="11" fill="#0b1f3a">DAAB: avoidance and adjudication</text></g>
</svg>