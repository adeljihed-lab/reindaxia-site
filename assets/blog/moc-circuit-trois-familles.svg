<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="40" y="120" width="165" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="228" y="120" width="165" height="66" rx="8" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><line x1="205" y1="153" x2="226" y2="153" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="416" y="120" width="165" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="393" y1="153" x2="414" y2="153" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="604" y="120" width="165" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="581" y1="153" x2="602" y2="153" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="792" y="120" width="165" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="769" y1="153" x2="790" y2="153" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="310" width="280" height="40" rx="8" fill="#0b1f3a" stroke="#1d2b44" stroke-width="2"/><rect x="40" y="350" width="280" height="70" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="350" y="310" width="280" height="40" rx="8" fill="#0b1f3a" stroke="#1d2b44" stroke-width="2"/><rect x="350" y="350" width="280" height="70" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="660" y="310" width="280" height="40" rx="8" fill="#0b1f3a" stroke="#1d2b44" stroke-width="2"/><rect x="660" y="350" width="280" height="70" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Le circuit d'une modification</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Proportionné au risque, jamais décidé par une seule personne</text><text x="122.5" y="153.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">1. Identifier</text><text x="122" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">pas un remplacement</text><text x="122" y="222.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">à l'identique ?</text><text x="310.5" y="153.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">2. Évaluer</text><text x="310" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">procédé, matériaux,</text><text x="310" y="222.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">exploitation, HAZOP</text><text x="498.5" y="153.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">3. Autoriser</text><text x="498" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">par un autre que</text><text x="498" y="222.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">le demandeur</text><text x="686.5" y="144.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">4. Mettre en</text><text x="686.5" y="161.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">œuvre</text><text x="686" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">plans, procédures,</text><text x="686" y="222.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">formation, PSSR</text><text x="874.5" y="153.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">5. Clôturer</text><text x="874" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">ou revenir à l'état</text><text x="874" y="222.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">d'origine à échéance</text><text x="40" y="290.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">Trois familles, trois accidents</text><text x="180.0" y="330.0" font-size="14" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Temporaire</text><text x="180.0" y="369.4" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">Flixborough 1974</text><text x="180.0" y="385.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">tuyau provisoire</text><text x="180.0" y="400.6" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">sans calcul</text><text x="490.0" y="330.0" font-size="14" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Physique</text><text x="490.0" y="369.4" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">Geismar 2013</text><text x="490.0" y="385.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">vannes ajoutées,</text><text x="490.0" y="400.6" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">plans non mis à jour</text><text x="800.0" y="330.0" font-size="14" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Organisationnelle</text><text x="800.0" y="369.4" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">Longford 1998</text><text x="800.0" y="385.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">experts transférés</text><text x="800.0" y="400.6" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">au siège</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="526" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="548" x2="986" y2="548" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="526" x2="756" y2="572" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="541" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="564" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="541" font-size="11" fill="#0b1f3a">Croquis · 04/2023</text><text x="766" y="564" font-size="11" fill="#0b1f3a">Gestion des modifications</text></g>
</svg>