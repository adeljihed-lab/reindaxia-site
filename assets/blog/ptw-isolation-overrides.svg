<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-label="Three barriers that fail together">
<defs>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e9e2d2" stroke-width="1"/></pattern>
<filter id="r" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="32"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2b44"/></marker>
</defs>
<rect width="1000" height="624" fill="#fbf8f1"/><rect width="1000" height="624" fill="url(#g)"/>
<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="300" cy="280" r="135" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><circle cx="470" cy="280" r="135" fill="#dbe6f3" stroke="#1d2b44" stroke-width="2"/><circle cx="385" cy="410" r="135" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Permit, isolation, override: one barrier, three registers</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">The interfaces and the shift handover are where information gets lost</text><text x="300" y="220.0" font-size="16" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">PERMIT</text><text x="300" y="240.0" font-size="16" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">TO WORK</text><text x="500" y="230.0" font-size="16" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">ISOLATION</text><text x="385" y="462.5" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">INHIBITS</text><text x="385" y="480.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">OVERRIDES</text><text x="385" y="497.5" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">DEFEATS</text><text x="385" y="321.2" font-size="14" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">shift</text><text x="385" y="338.8" font-size="14" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">handover</text><text x="240" y="292.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">who · what · where</text><text x="240" y="307.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">site visit · SIMOPS</text><text x="530" y="292.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">positive or proven</text><text x="530" y="307.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">zero energy verified</text><text x="630" y="150.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">▸ Permit references its isolations and overrides</text><text x="630" y="212.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">▸ No isolation removed while a dependent permit is open</text><text x="630" y="274.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">▸ Override removed before the permit is closed</text><text x="630" y="336.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">▸ Three registers reviewed together at every handover</text><text x="630" y="398.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">▸ Monthly field walk-through: registers vs ground</text><text x="630" y="462.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Piper Alpha, 1988: a PSV removed under one permit,</text><text x="630" y="477.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">a pump restarted under another, at night.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="566" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="588" x2="986" y2="588" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="566" x2="756" y2="612" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="581" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="604" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="581" font-size="11" fill="#0b1f3a">Sketch · 10/2022</text><text x="766" y="604" font-size="11" fill="#0b1f3a">Three barriers that fail together</text></g>
</svg>