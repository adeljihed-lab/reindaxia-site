<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" role="img" aria-label="Site changes: three decision routes">
<defs>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e9e2d2" stroke-width="1"/></pattern>
<filter id="r" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="6"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2b44"/></marker>
</defs>
<rect width="1000" height="664" fill="#fbf8f1"/><rect width="1000" height="664" fill="url(#g)"/>
<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="380" y="100" width="240" height="50" rx="8" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><line x1="500" y1="150" x2="500" y2="180" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><polygon points="500,182.0 665.0,230 500,278.0 335.0,230" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><line x1="665" y1="230" x2="740" y2="230" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="740" y="195" width="220" height="70" rx="8" fill="#f6d5cf" stroke="#1d2b44" stroke-width="2"/><line x1="500" y1="278" x2="500" y2="310" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><polygon points="500,310.0 665.0,358 500,406.0 335.0,358" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><line x1="665" y1="358" x2="740" y2="358" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="740" y="323" width="220" height="70" rx="8" fill="#dbe6f3" stroke="#1d2b44" stroke-width="2"/><line x1="500" y1="406" x2="500" y2="438" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="380" y="438" width="240" height="60" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><path d="M 960 230 L 985 230 L 985 545 L 640 545" stroke="#1d2b44" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 960 358 L 985 358 L 985 545 L 640 545" stroke="#1d2b44" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><line x1="500" y1="498" x2="500" y2="530" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="330" y="530" width="300" height="40" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Which route for a field change?</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Scale the decision to the impact, never to the urgency</text><text x="500.0" y="125.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Change needed in the field</text><text x="500" y="221.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Safety, process,</text><text x="500" y="238.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">performance or scope?</text><text x="700" y="215.0" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">yes</text><text x="850.0" y="222.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">MANAGEMENT OF CHANGE</text><text x="850.0" y="237.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">risk review · owner approval</text><text x="518" y="294.0" font-size="13" text-anchor="start" font-weight="700" fill="#2f6b4f" dominant-baseline="middle">no</text><text x="500" y="342.4" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Departs from an AFC</text><text x="500" y="358.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">document beyond a minor</text><text x="500" y="373.6" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">adjustment?</text><text x="700" y="343.0" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">yes</text><text x="850.0" y="350.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">TECHNICAL QUERY</text><text x="850.0" y="365.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">written reply · doc revision</text><text x="518" y="422.0" font-size="13" text-anchor="start" font-weight="700" fill="#2f6b4f" dominant-baseline="middle">no</text><text x="500.0" y="460.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">RED-LINE MARK-UP</text><text x="500.0" y="475.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">master copy · stamp · signature</text><text x="480.0" y="550.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">As-built set → MC walkdown</text><text x="40" y="445.6" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Supervisor in doubt?</text><text x="40" y="461.9" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Ask engineering —</text><text x="40" y="478.1" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">the red line is the</text><text x="40" y="494.4" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">exception, not the rule.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="606" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="628" x2="986" y2="628" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="606" x2="756" y2="652" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="621" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="644" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="621" font-size="11" fill="#0b1f3a">Sketch · 06/2022</text><text x="766" y="644" font-size="11" fill="#0b1f3a">Site changes: three decision routes</text></g>
</svg>