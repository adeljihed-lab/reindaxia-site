<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Chaque modification passe deux filtres</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">D'abord la loi, ensuite les cinq Golden Principles</text><text x="500.0" y="125.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Modification envisagée</text><text x="500" y="216.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">La loi ou le bailleur</text><text x="500" y="233.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">l'exige-t-il ?</text><text x="685" y="210.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6b4f" dominant-baseline="middle">oui</text><text x="845.0" y="208.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Rédiger précisément</text><text x="845.0" y="225.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+ contrôle d'effet</text><text x="845.0" y="241.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">sur les renvois</text><text x="315" y="210.0" font-size="13" text-anchor="middle" font-weight="700" fill="#b23a2e" dominant-baseline="middle">non</text><text x="155.0" y="208.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Quel problème règle-t-elle ?</text><text x="155.0" y="225.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Un délai suffit-il</text><text x="155.0" y="241.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">au lieu d'un veto ?</text><text x="500" y="352.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">Test des Golden Principles</text><text x="155.0" y="402.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">GP1</text><text x="155.0" y="419.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">rôles</text><text x="155.0" y="435.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">intacts</text><text x="327.0" y="402.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">GP2</text><text x="327.0" y="419.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">clause</text><text x="327.0" y="435.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">claire</text><text x="499.0" y="402.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">GP3</text><text x="499.0" y="419.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">risques</text><text x="499.0" y="435.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">équilibrés</text><text x="671.0" y="402.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">GP4</text><text x="671.0" y="419.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">délais</text><text x="671.0" y="435.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">raisonnables</text><text x="843.0" y="402.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">GP5</text><text x="843.0" y="419.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">DAAB avant</text><text x="843.0" y="435.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">le juge</text><text x="390.0" y="543.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">retenue</text><text x="610.0" y="543.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">réécrite ou supprimée</text></g>
