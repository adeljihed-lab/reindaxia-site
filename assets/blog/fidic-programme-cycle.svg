<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Time management cycle under the Red Book</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Programme = baseline · report = mirror · early warning = radar</text><text x="60" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Notice 8.1</text><text x="60" y="228.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">commencement</text><text x="260" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+28 days</text><text x="260" y="228.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">initial programme</text><text x="470" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+21 days</text><text x="470" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">deemed no-objection</text><text x="470" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">→ the Programme</text><text x="690" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">each month +7 d</text><text x="690" y="228.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">progress report 4.20</text><text x="880" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">when reality departs</text><text x="880" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">revised programme</text><text x="880" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">(+14 d review)</text><text x="60" y="345.0" font-size="14" text-anchor="start" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Reviewable programme — checklist</text><text x="70" y="378.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">☐  logic, not dates; few constraints</text><text x="70" y="406.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">☐  credible critical path, visible float</text><text x="70" y="434.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">☐  access dates, review periods, hold points</text><text x="70" y="462.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">☐  resources consistent with durations</text><text x="70" y="490.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">☐  detail measurable monthly</text><text x="540" y="345.0" font-size="14" text-anchor="start" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Early warning register (8.4)</text><text x="615.0" y="379.0" font-size="12" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">event</text><text x="730.0" y="379.0" font-size="12" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">effect</text><text x="825.0" y="379.0" font-size="12" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">action</text><text x="922.5" y="379.0" font-size="12" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">owner</text><text x="615.0" y="408.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">late land handover</text><text x="730.0" y="408.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">time</text><text x="825.0" y="408.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">RFP 13.3.2</text><text x="922.5" y="408.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">Employer</text><text x="615.0" y="438.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">supplier failing</text><text x="730.0" y="438.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">time/cost</text><text x="825.0" y="438.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">2nd source</text><text x="922.5" y="438.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">Contractor</text><text x="615.0" y="468.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">utility diversion</text><text x="730.0" y="468.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">price</text><text x="825.0" y="468.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">decide</text><text x="922.5" y="468.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">Engineer</text><text x="540" y="500.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">not a Notice of Claim: the 28-day clock still applies</text></g>
