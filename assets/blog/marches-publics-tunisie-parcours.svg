marker-end="url(#ah)"/><rect x="760" y="430" width="190" height="66" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><line x1="712" y1="463" x2="758" y2="463" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><path d="M 925 176 C 975 210, 975 250, 925 300" stroke="#1d2b44" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 75 336 C 25 370, 25 410, 75 460" stroke="#1d2b44" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round" stroke-linejoin="round"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Le parcours d'un marché public (décret 2014-1039)</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Délais clés à retenir à chaque étape</text><text x="135.0" y="134.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Besoin et plan</text><text x="135.0" y="151.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">prévisionnel</text><text x="135" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">publié ≥ 30 j avant</text><text x="375.0" y="134.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Mode de</text><text x="375.0" y="151.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">passation</text><text x="375" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">AO, consultation…</text><text x="615.0" y="134.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Cahier des</text><text x="615.0" y="151.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">charges</text><text x="615" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">neutre, complet</text><text x="855.0" y="134.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Avis d'appel</text><text x="855.0" y="151.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">d'offres</text><text x="855" y="198.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">≥ 30 j (15 j urgence)</text><text x="135.0" y="294.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Commission de</text><text x="135.0" y="311.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">contrôle</text><text x="135" y="358.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">avis préalable</text><text x="375.0" y="303.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Évaluation</text><text x="375" y="350.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">conformité,</text><text x="375" y="365.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">moins-disant</text><text x="615.0" y="294.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Ouverture</text><text x="615.0" y="311.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">des plis</text><text x="615" y="358.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">séance publique</text><text x="855.0" y="294.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Remise des offres</text><text x="855.0" y="311.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">TUNEPS</text><text x="855" y="358.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">validité 60–120 j</text><text x="135.0" y="463.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Notification</text><text x="375.0" y="454.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Cautionnement</text><text x="375.0" y="471.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">définitif</text><text x="375" y="518.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">≤ 20 j · ≤ 3 %</text><text x="615.0" y="454.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Exécution</text><text x="615.0" y="471.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">avenants</text><text x="615" y="518.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">≤ 20 % sans avenant*</text><text x="855.0" y="454.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Réceptions</text><text x="855.0" y="471.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">et clôture</text><text x="855" y="518.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">restitution ≤ 4 mois</text><text x="40" y="590.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">* limite de variation de la masse fixée au cahier des charges ; à défaut 20 % (art. 88).</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="626" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="648" x2="986" y2="648" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="626" x2="756" y2="672" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="641" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="664" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="641" font-size="11" fill="#0b1f3a">Croquis · 04/2025</text><text x="766" y="664" font-size="11" fill="#0b1f3a">Marché public tunisien : du besoin à</text></g>
</svg>