<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Des incidents sans lien apparent, une seule cause</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Exemple réel anonymisé : le contrôle à réception avant pose</text><text x="170.0" y="134.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">câbles souples posés</text><text x="170.0" y="151.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">au lieu de câbles armés</text><text x="170.0" y="226.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">batteries défectueuses</text><text x="170.0" y="243.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">découvertes une fois posées</text><text x="170.0" y="318.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">portes de cellules</text><text x="170.0" y="335.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">endommagées au transport</text><text x="170.0" y="410.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">relais non communicant</text><text x="170.0" y="427.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">découvert à la mise en service</text><text x="520.0" y="273.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Cause commune :</text><text x="520.0" y="290.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">pas de contrôle avant</text><text x="520.0" y="306.9" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">expédition ni avant pose</text><text x="825" y="155.0" font-size="14" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Plan de contrôle fournisseur</text><text x="700" y="195.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ FAT pour les critiques</text><text x="700" y="231.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ rapports d'essais usine</text><text x="700" y="246.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">pour tous les lots</text><text x="700" y="275.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ fiches techniques vs contrat</text><text x="700" y="290.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">avant livraison</text><text x="700" y="327.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ check-list avant expédition</text><text x="700" y="363.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ exigences d'emballage</text><text x="700" y="378.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">en annexe</text><text x="700" y="407.2" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">✓ contrôle à réception</text><text x="700" y="422.8" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">avant toute pose</text></g>
