<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">De l'essai de type à la mise en service</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Où se place la FAT, et ce qui doit être réuni avant de libérer l'équipement</text><text x="115.0" y="135.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Essais</text><text x="115.0" y="155.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">de type</text><text x="115" y="197.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">labo / usine</text><text x="115" y="212.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">une fois par modèle</text><text x="305.0" y="135.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Essais</text><text x="305.0" y="155.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">individuels</text><text x="305" y="197.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">usine</text><text x="305" y="212.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">chaque unité</text><text x="495.0" y="145.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">FAT</text><text x="495" y="197.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">usine</text><text x="495" y="212.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">unité du contrat</text><text x="685.0" y="145.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">SIT</text><text x="685" y="197.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">site</text><text x="685" y="212.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">intégration</text><text x="875.0" y="145.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">SAT</text><text x="875" y="197.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">site</text><text x="875" y="212.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">installation finale</text><text x="145" y="270.0" font-size="12" text-anchor="middle" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">AVANT</text><text x="145.0" y="318.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">procédure approuvée</text><text x="145.0" y="374.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">critères chiffrés</text><text x="145.0" y="430.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">ITP réalisé</text><text x="145.0" y="478.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">variantes acceptées</text><text x="145.0" y="493.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">par écrit</text><text x="145.0" y="534.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">témoins compétents</text><text x="145.0" y="549.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">par technologie</text><text x="395" y="270.0" font-size="12" text-anchor="middle" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">PENDANT</text><text x="395.0" y="310.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">instruments étalonnés</text><text x="395.0" y="325.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">(n° de série vérifiés)</text><text x="395.0" y="366.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">configuration réelle</text><text x="395.0" y="381.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">logiciel, paramétrage</text><text x="395.0" y="422.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">interfaces et</text><text x="395.0" y="437.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">communications</text><text x="395.0" y="478.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">écarts notés sur place</text><text x="395.0" y="493.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">(photo + réf. essai)</text><text x="645" y="270.0" font-size="12" text-anchor="middle" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">APRÈS</text><text x="645.0" y="310.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">réserves classées</text><text x="645.0" y="325.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">avant expédition / site</text><text x="645.0" y="366.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">manuels, logiciels,</text><text x="645.0" y="381.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">licences</text><text x="645.0" y="422.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">formation sur</text><text x="645.0" y="437.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">l'équipement réel</text><text x="645.0" y="486.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">emballage contrôlé</text><text x="860" y="400.0" font-size="15" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Libération ?</text><text x="860.0" y="522.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">note de libération</text><text x="860" y="281.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">dossier complet</text><text x="860" y="296.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">+ réserves « avant</text><text x="860" y="311.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">expédition » levées</text></g>
