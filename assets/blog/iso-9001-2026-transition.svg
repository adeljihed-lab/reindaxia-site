<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">ISO 9001:2026 : ce qui bouge et comment s'y préparer</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Articles à revoir en priorité, puis cinq temps pour la transition</text><text x="125.0" y="130.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">4.1 / 4.2</text><text x="125.0" y="170.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">contexte, climat,</text><text x="125.0" y="185.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">parties intéressées</text><text x="313.0" y="130.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">5.1 / 5.2</text><text x="313.0" y="170.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">culture qualité,</text><text x="313.0" y="185.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">éthique</text><text x="501.0" y="130.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">6.1</text><text x="501.0" y="170.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">risques et</text><text x="501.0" y="185.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">opportunités séparés</text><text x="689.0" y="130.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">6.3</text><text x="689.0" y="170.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">planification</text><text x="689.0" y="185.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">des modifications</text><text x="877.0" y="130.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">7.3</text><text x="877.0" y="178.0" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">sensibilisation</text><text x="125" y="300.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">1</text><text x="125" y="346.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Lire</text><text x="125" y="363.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">norme + annexe A</text><text x="313" y="300.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">2</text><text x="313" y="346.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Comparer</text><text x="313" y="363.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">le système</text><text x="501" y="300.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">3</text><text x="501" y="346.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Décider</text><text x="501" y="363.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">culture &amp; éthique</text><text x="689" y="300.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">4</text><text x="689" y="346.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Former</text><text x="689" y="363.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">les auditeurs</text><text x="877" y="300.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">5</text><text x="877" y="346.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Auditer</text><text x="877" y="363.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+ revue de direction</text><text x="40" y="440.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Période de transition habituelle : trois ans (IAF) — date exacte à confirmer avec l'organisme certificateur.</text></g>
