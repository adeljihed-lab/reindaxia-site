<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">The Red Book as a project control system</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Five mechanisms that turn events into decisions while the works are running</text><text x="500" y="329.4" font-size="17" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Contract</text><text x="500" y="350.6" font-size="17" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">under control</text><text x="500.0" y="131.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Programme 8.3</text><text x="500.0" y="148.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">&amp; advance warning 8.4</text><text x="790.0" y="251.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Quality 4.9</text><text x="790.0" y="268.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">compliance verification</text><text x="700.0" y="491.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Variations 13</text><text x="700.0" y="508.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">&amp; measurement 12</text><text x="300.0" y="491.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Payment 14 · claims 20</text><text x="300.0" y="508.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">· DAAB 21</text><text x="210.0" y="251.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Engineer 3.7</text><text x="210.0" y="268.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">agree / determine</text><text x="40" y="560.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Golden Principles: roles kept · clear PCs · risk balance · reasonable time limits · dispute board first</text></g>
