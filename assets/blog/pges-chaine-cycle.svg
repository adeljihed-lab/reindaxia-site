<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Du PGES du projet au chantier, et retour</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">La chaîne documentaire descend ; les données de terrain doivent remonter chaque mois</text><text x="140.0" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">EIES</text><text x="140" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">maître d'ouvrage</text><text x="380.0" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">PGES projet</text><text x="380" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">maître d'ouvrage</text><text x="620.0" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">PGES-C</text><text x="620" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">entreprise</text><text x="860.0" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Plans par site</text><text x="860" y="192.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">entreprise</text><text x="40" y="225.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Cadre des bailleurs : normes de performance SFI · cadre E&amp;S Banque mondiale · directives EHS · loi nationale</text><text x="500.0" y="262.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Analyse des risques</text><text x="500.0" y="277.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">par activité et par site</text><text x="720.0" y="352.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Mesures, responsables,</text><text x="720.0" y="367.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">moyens, budget</text><text x="640.0" y="464.4" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Mise en œuvre :</text><text x="640.0" y="480.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">accueil, causeries,</text><text x="640.0" y="495.6" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">inspections, registres</text><text x="360.0" y="472.2" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Indicateurs et</text><text x="360.0" y="487.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">rapport mensuel</text><text x="280.0" y="344.4" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Revue et mise à jour</text><text x="280.0" y="360.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">(nouveau site, incident,</text><text x="280.0" y="375.6" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">plainte récurrente)</text><text x="500" y="384.4" font-size="17" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">PGES</text><text x="500" y="405.6" font-size="17" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">vivant</text><text x="885.0" y="480.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Risques réalisés :</text><text x="885.0" y="495.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">arrêt municipal,</text><text x="885.0" y="510.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">pluies, déchets</text></g>
