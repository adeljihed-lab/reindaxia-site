<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Suivre le cumul des variations, pas chaque variation</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Courbe illustrative : déclencher l'avenant au seuil d'alerte, pas au dépassement</text><text x="910" y="498.0" font-size="13" text-anchor="end" font-weight="400" fill="#1d2b44" dominant-baseline="middle">temps</text><text x="80" y="126.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">cumul des variations / montant du marché</text><text x="905" y="192.0" font-size="12.5" text-anchor="end" font-weight="400" fill="#b23a2e" dominant-baseline="middle">limite (20 % à défaut de stipulation)</text><text x="905" y="280.4" font-size="12.5" text-anchor="end" font-weight="400" fill="#a86b00" dominant-baseline="middle">seuil d'alerte (≈ 2/3 de la limite)</text><text x="78" y="404.0" font-size="12" text-anchor="end" font-weight="400" fill="#1d2b44" dominant-baseline="middle">5 %</text><text x="78" y="338.0" font-size="12" text-anchor="end" font-weight="400" fill="#1d2b44" dominant-baseline="middle">10 %</text><text x="78" y="272.0" font-size="12" text-anchor="end" font-weight="400" fill="#1d2b44" dominant-baseline="middle">15 %</text><text x="78" y="206.0" font-size="12" text-anchor="end" font-weight="400" fill="#1d2b44" dominant-baseline="middle">20 %</text><text x="350" y="496.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">avenant 1</text><text x="590" y="496.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">avenant 2</text><text x="830" y="496.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1d2b44" dominant-baseline="middle">avenant 3</text><text x="110" y="166.4" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">au-delà de la limite : avenant obligatoire ; le titulaire peut demander la résiliation (45 j, art. 84)</text></g>
