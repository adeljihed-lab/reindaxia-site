<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Du contrat aux preuves : le fil du plan qualité</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Chaque exigence contractuelle doit retrouver un outil, un responsable et une preuve</text><text x="115.0" y="150.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Contrat</text><text x="115.0" y="170.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+ annexes</text><text x="115" y="222.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">« doit », « shall »</text><text x="305.0" y="150.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Matrice de</text><text x="305.0" y="170.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">conformité</text><text x="305" y="222.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">exigence → section</text><text x="495.0" y="150.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Plan qualité</text><text x="495.0" y="170.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">projet</text><text x="495" y="222.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">cycle de vie</text><text x="685.0" y="160.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Outils</text><text x="685" y="214.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">procédures, ITP,</text><text x="685" y="229.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">registres</text><text x="875.0" y="160.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Preuves</text><text x="875" y="214.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">enregistrements,</text><text x="875" y="229.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">dossier final</text><text x="495" y="318.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">commentaires du client · audits · modifications du contrat → mise à jour</text><text x="40" y="375.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">Extrait de matrice (exemple type)</text><text x="155.0" y="411.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Exigence (réf.)</text><text x="350.0" y="411.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Section du plan</text><text x="515.0" y="411.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Outil</text><text x="680.0" y="411.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Responsable</text><text x="860.0" y="411.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Preuve</text><text x="155.0" y="442.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2b44" dominant-baseline="middle">Annexe Q §4.2 — ITP soumis</text><text x="350.0" y="442.0" font-size="12" text-anchor="middle" font-weight="400" 