<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">A claim from awareness to decision</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Every notice creates two future dates: diary them on the day it is sent</text><text x="60" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Day 0</text><text x="60" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">aware (or should</text><text x="60" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">have been)</text><text x="220" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 28 d</text><text x="220" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Notice of Claim</text><text x="220" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">(time bar)</text><text x="360" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+14 d</text><text x="360" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">Engineer: late?</text><text x="360" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">else deemed valid</text><text x="520" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">≤ 84 d</text><text x="520" y="220.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">fully detailed claim</text><text x="520" y="235.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">(legal basis!)</text><text x="700" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+42 d</text><text x="700" y="228.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">agreement</text><text x="850" y="156.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">+42 d</text><text x="850" y="228.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" dominant-baseline="middle">determination</text><text x="180.0" y="350.6" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Continuing effect?</text><text x="180.0" y="366.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">interim claims monthly</text><text x="180.0" y="383.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">final claim within 28 d</text><text x="180.0" y="399.4" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">after effects end</text><text x="500.0" y="350.6" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Contemporary records</text><text x="500.0" y="366.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">diaries · resources · photos</text><text x="500.0" y="383.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">weather · letters</text><text x="500.0" y="399.4" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">kept from Day 0</text><text x="820.0" y="350.6" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Then</text><text x="820.0" y="366.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">NOD 28 d → DAAB ≤ 42 d</text><text x="820.0" y="383.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">→ decision 84 d</text><text x="820.0" y="399.4" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">→ NOD 28 d → arbitration</text><text x="40" y="470.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Weekly 15-minute review: what happened this week that may be a claim event? If in doubt, notify.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="546" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="568" x2="986" y2="568" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="546" x2="756" y2="592" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="561" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="584" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="561" font-size="11" fill="#0b1f3a">Sketch · 03/2026</text><text x="766" y="584" font-size="11" fill="#0b1f3a">Clause 20 claim clocks</text></g>
</svg>