ine="middle">fissures ramifiées, transgranulaires,</text><text x="760" y="477.8" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">sans perte d'épaisseur visible</text><text x="40" y="540.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">316L ≠ meilleur que 304L en CSCC : le Mo aide contre les piqûres, pas ici.</text></g>
