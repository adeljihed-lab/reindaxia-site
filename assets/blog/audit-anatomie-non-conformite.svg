<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Anatomie d'une non-conformité utile</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Trois éléments pour le constat, deux réponses distinctes, une vérification qui ferme la boucle</text><text x="132.5" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Exigence</text><text x="132" y="192.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">norme · article</text><text x="132" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">contrat · procédure</text><text x="347.5" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Preuve</text><text x="347" y="192.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">document, date, lieu,</text><text x="347" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">observation, entretien</text><text x="562.5" y="140.0" font-size="16" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Écart</text><text x="562" y="192.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">ce qui manque,</text><text x="562" y="207.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">dit précisément</text><text x="840.0" y="130.6" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">Non-conformité</text><text x="840.0" y="149.4" font-size="15" text-anchor="middle" font-weight="600" fill="#fff" dominant-baseline="middle">majeure / mineure</text><text x="250.0" y="303.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">CORRECTION</text><text x="250.0" y="320.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">traite l'écart constaté</text><text x="250.0" y="336.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">(remplacer, réparer, acquérir)</text><text x="700.0" y="303.8" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">ACTION CORRECTIVE</text><text x="700.0" y="320.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">traite la cause</text><text x="700.0" y="336.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">(5 pourquoi, Ishikawa)</text><text x="700.0" y="426.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Vérification d'efficacité</text><text x="700.0" y="443.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">critère + date fixés d'avance</text><text x="40" y="500.0" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Défauts fréquents : preuve absente · mauvaise norme citée · libellé qui répète l'exigence · cause = « erreur humaine »</text></g>
