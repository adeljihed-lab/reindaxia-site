<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Une leçon n'existe que lorsqu'un document change</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Le cycle complet, et l'endroit où il se casse le plus souvent</text><text x="500.0" y="151.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Événement</text><text x="500.0" y="168.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">raconté</text><text x="716.5063509461097" y="246.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Cause racine</text><text x="716.5063509461097" y="263.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">analysée</text><text x="716.5063509461097" y="436.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Leçon écrite</text><text x="716.5063509461097" y="453.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">pour d'autres projets</text><text x="500.0" y="531.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Document modifié</text><text x="500.0" y="548.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">(procédure, clause, check-list)</text><text x="283.4936490538904" y="436.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Lu au lancement</text><text x="283.4936490538904" y="453.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">du projet suivant</text><text x="283.49364905389035" y="246.9" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Efficacité</text><text x="283.49364905389035" y="263.1" font-size="13" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">vérifiée</text><text x="500" y="328.8" font-size="18" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">organisation</text><text x="500" y="351.2" font-size="18" text-anchor="middle" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">qui apprend</text><text x="500" y="390.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">explicite + tacite</text><text x="891.5063509461097" y="469.4" font-size="12.5" text-anchor="middle" font-weight="600" fill="#b23a2e" dominant-baseline="middle">rupture fréquente :</text><text x="891.5063509461097" y="485.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#b23a2e" dominant-baseline="middle">la leçon reste</text><text x="891.5063509461097" y="500.6" font-size="12.5" text-anchor="middle" font-weight="600" fill="#b23a2e" dominant-baseline="middle">dans le registre</text></g>
