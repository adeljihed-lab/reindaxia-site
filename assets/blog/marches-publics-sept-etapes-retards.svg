2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">Sept étapes, sept réservoirs de retard</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Les retards naissent souvent bien avant le premier coup de pelle</text><text x="90.0" y="165.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Passation</text><text x="90" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">clarifications,</text><text x="90" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">attente des avis</text><text x="227.0" y="156.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Mise en</text><text x="227.0" y="173.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">vigueur</text><text x="227" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">garanties, avance,</text><text x="227" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">ordre de service</text><text x="364.0" y="156.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Démarrage</text><text x="364.0" y="173.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">et études</text><text x="364" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">études d'exécution,</text><text x="364" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">validations</text><text x="501.0" y="156.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Approvision-</text><text x="501.0" y="173.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">nements</text><text x="501" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">fabrication,</text><text x="501" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">douane, transport</text><text x="638.0" y="165.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Exécution</text><text x="638" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">emprises, réseaux,</text><text x="638" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">interfaces</text><text x="775.0" y="156.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Sauvegardes</text><text x="775.0" y="173.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">E&amp;S</text><text x="775" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">réinstallation,</text><text x="775" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">autorisations</text><text x="912.0" y="156.6" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Réclamations</text><text x="912.0" y="173.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">et plaintes</text><text x="912" y="227.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">traitement tardif,</text><text x="912" y="242.5" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">litiges</text><text x="500" y="395.0" font-size="14" text-anchor="middle" font-weight="400" fill="#b23a2e" font-style="italic" dominant-baseline="middle">glissement cumulé de la date de mise en service</text><text x="40" y="450.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">Ce qui réduit le glissement</text><text x="147.5" y="488.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">études préalables</text><text x="147.5" y="503.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">et foncier libérés</text><text x="382.5" y="488.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">mise en vigueur</text><text x="382.5" y="503.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">préparée avant signature</text><text x="617.5" y="488.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">plan d'achats lié</text><text x="617.5" y="503.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">au programme</text><text x="852.5" y="488.2" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">registre des plaintes</text><text x="852.5" y="503.8" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1d2b44" dominant-baseline="middle">traité chaque mois</text></g>
