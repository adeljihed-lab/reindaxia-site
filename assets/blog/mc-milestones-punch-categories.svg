<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-label="Mechanical completion milestones">
<defs>
<pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e9e2d2" stroke-width="1"/></pattern>
<filter id="r" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2b44"/></marker>
</defs>
<rect width="1000" height="624" fill="#fbf8f1"/><rect width="1000" height="624" fill="url(#g)"/>
<g filter="url(#r)"><path d="M30 54 q 120 -6 240 0 t 200 -2" stroke="#f2a71b" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="40" y="110" width="200" height="70" rx="8" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="280" y="110" width="200" height="70" rx="8" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><line x1="240" y1="145" x2="278" y2="145" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="520" y="110" width="200" height="70" rx="8" fill="#dbe6f3" stroke="#1d2b44" stroke-width="2"/><line x1="480" y1="145" x2="518" y2="145" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><rect x="760" y="110" width="200" height="70" rx="8" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><line x1="720" y1="145" x2="758" y2="145" stroke="#1d2b44" stroke-width="2" marker-end="url(#ah)"/><circle cx="70" cy="340" r="26" fill="#f6d5cf" stroke="#1d2b44" stroke-width="2"/><circle cx="380" cy="340" r="26" fill="#fde7bd" stroke="#1d2b44" stroke-width="2"/><circle cx="690" cy="340" r="26" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><rect x="40" y="410" width="600" height="110" rx="6" fill="#fff" stroke="#1d2b44" stroke-width="2"/><rect x="60" y="450" width="230" height="22" rx="2" fill="#e3efe6" stroke="#1d2b44" stroke-width="2"/><rect x="60" y="482" width="460" height="22" rx="2" fill="#f6d5cf" stroke="#1d2b44" stroke-width="2"/></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="30" y="38.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b1f3a" dominant-baseline="middle">From construction to start-up, subsystem by subsystem</text><text x="30" y="76.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Each certificate rests on records; each punch category is a gate for the next step</text><text x="140.0" y="136.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">Construction</text><text x="140.0" y="153.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">complete</text><text x="380.0" y="136.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">MCC</text><text x="380.0" y="153.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">mechanical completion</text><text x="620.0" y="136.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">RFC</text><text x="620.0" y="153.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">ready for commissioning</text><text x="860.0" y="136.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">RFSU</text><text x="860.0" y="153.8" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2b44" dominant-baseline="middle">ready for start-up</text><text x="380" y="202.2" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">A-ITRs</text><text x="380" y="217.8" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">construction checks</text><text x="620" y="202.2" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">B-ITRs</text><text x="620" y="217.8" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">pre-commissioning tests</text><text x="860" y="202.2" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">functional</text><text x="860" y="217.8" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">commissioning</text><text x="40" y="270.0" font-size="16" text-anchor="start" font-weight="700" fill="#0b1f3a" dominant-baseline="middle">Punch categories = effect on the NEXT step</text><text x="70" y="340.0" font-size="22" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">A</text><text x="110" y="323.8" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">blocks the next phase</text><text x="110" y="340.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">(e.g. Ex gland wrongly fitted</text><text x="110" y="356.2" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">on Zone 1 equipment)</text><text x="380" y="340.0" font-size="22" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">B</text><text x="420" y="331.9" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">blocks commissioning</text><text x="420" y="348.1" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">completion / start-up</text><text x="690" y="340.0" font-size="22" text-anchor="middle" font-weight="800" fill="#1d2b44" dominant-baseline="middle">C</text><text x="730" y="323.8" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">spec item, no effect on</text><text x="730" y="340.0" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">performance or safe operation</text><text x="730" y="356.2" font-size="13" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">(e.g. missing earth tag label)</text><text x="60" y="432.0" font-size="14" text-anchor="start" font-weight="700" fill="#1d2b44" dominant-baseline="middle">Dossier cycle observed (≈750 subsystems)</text><text x="300" y="461.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1d2b44" dominant-baseline="middle">30 days expected</text><text x="530" y="493.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#b23a2e" dominant-baseline="middle">60 days median</text><text x="660" y="415.6" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">Fix early: subsystem breakdown,</text><text x="660" y="431.9" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">categorisation matrix, dossier</text><text x="660" y="448.1" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">content, earthing strategy,</text><text x="660" y="464.4" font-size="13" text-anchor="start" font-weight="400" fill="#6b7280" font-style="italic" dominant-baseline="middle">24 h ITR signature.</text></g>
<g font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="686" y="566" width="300" height="46" fill="#fff" stroke="#0b1f3a" stroke-width="1.5"/><line x1="686" y1="588" x2="986" y2="588" stroke="#0b1f3a" stroke-width="1"/><line x1="756" y1="566" x2="756" y2="612" stroke="#0b1f3a" stroke-width="1"/><text x="721" y="581" font-size="11" text-anchor="middle" fill="#0b1f3a" font-weight="700">REINDAXIA</text><text x="721" y="604" font-size="11" text-anchor="middle" fill="#0b1f3a">Fig. 1</text><text x="766" y="581" font-size="11" fill="#0b1f3a">Sketch · 02/2024</text><text x="766" y="604" font-size="11" fill="#0b1f3a">Mechanical completion milestones</text></g>
</svg>